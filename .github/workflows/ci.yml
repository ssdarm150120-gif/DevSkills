name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Instalar ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck -x -e SC1090,SC1091 bin/devskills install.sh uninstall.sh hooks/vetar_acciones_externas.sh
          shellcheck -x -e SC1090,SC1091,SC2034,SC2154,SC2329 spec/spec_helper.sh

  manifiestos:
    name: Manifiestos del plugin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Estructura del plugin
        run: python3 scripts/validar_plugin.py
      - name: Validar con Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.300
          claude plugin validate .

  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Instalar ShellSpec
        run: |
          git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "$HOME/shellspec"
          echo "$HOME/shellspec" >> "$GITHUB_PATH"
      - name: Identidad de git para las pruebas
        run: |
          git config --global user.name "Pruebas"
          git config --global user.email "pruebas@example.invalid"
      - name: Correr las pruebas
        # En Windows, RUNNER_TEMP llega con formato de Windows (unidad y barras invertidas) y ShellSpec necesita una ruta de Unix.
        run: |
          temporal="${RUNNER_TEMP:-/tmp}"
          if command -v cygpath >/dev/null 2>&1; then temporal="$(cygpath -u "$temporal")"; fi
          TMPDIR="$temporal" shellspec

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2@sha256:0e99e8821643ea5b235718642b93bb32486af9c8162c8b8731f7cbdc951a7f46 dir /repo --no-banner --redact

  # Genera un proyecto nuevo con `devskills init` y corre su calidad y su bateria SIN Docker (SIN_DOCKER=1 hace
  # que las pruebas de Compose y del certificado se omitan, como en una maquina sin Docker): prueba que lo que
  # el plugin entrega a un proyecto funciona de verdad, no solo que los instaladores copian archivos.
  esqueleto:
    name: Proyecto nuevo sin Docker (ruff, mypy, lint-imports, pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SIN_DOCKER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Identidad de git para el primer commit
        run: |
          git config --global user.name "Pruebas"
          git config --global user.email "pruebas@example.invalid"
      - name: Crear el proyecto con devskills init
        run: bin/devskills init "$RUNNER_TEMP/proyecto" --nombre "Proyecto CI" --slug proyecto-ci --puerto-base 21000
      - name: Instalar las dependencias del proyecto
        working-directory: ${{ runner.temp }}/proyecto/codigo
        run: |
          python -m venv "$RUNNER_TEMP/proyecto/.venv"
          "$RUNNER_TEMP/proyecto/.venv/bin/pip" install -r requirements-dev.txt
      - name: Calidad (ruff, mypy, lint-imports)
        working-directory: ${{ runner.temp }}/proyecto/codigo
        run: |
          . "$RUNNER_TEMP/proyecto/.venv/bin/activate"
          ruff check . && ruff format --check .
          mypy && mypy .
          lint-imports
          python -m herramientas.contratos_importlinter | diff - .importlinter
      - name: Bateria completa (pytest) sin Docker
        working-directory: ${{ runner.temp }}/proyecto/codigo
        run: |
          . "$RUNNER_TEMP/proyecto/.venv/bin/activate"
          pytest -q

  todo-en-verde:
    name: Todo en verde
    runs-on: ubuntu-24.04
    needs: [lint, manifiestos, pruebas, secretos, esqueleto]
    if: always()
    steps:
      - name: Revisar resultados
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.manifiestos.result }}" != "success" ]] || \
             [[ "${{ needs.pruebas.result }}" != "success" ]] || \
             [[ "${{ needs.secretos.result }}" != "success" ]] || \
             [[ "${{ needs.esqueleto.result }}" != "success" ]]; then
            echo "Algo falló."
            exit 1
          fi
          echo "Todo en verde."
