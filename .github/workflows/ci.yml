name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ShellCheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: ShellCheck
        run: |
          shellcheck -x -e SC1090,SC1091 bin/devskills install.sh uninstall.sh
          shellcheck -x -e SC1090,SC1091,SC2034,SC2154,SC2329 spec/spec_helper.sh

  manifiestos:
    name: Manifiestos del plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estructura del plugin
        run: python3 scripts/validar_plugin.py
      - name: Validar con Claude Code
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .

  pruebas:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar ShellSpec
        run: |
          git clone --depth 1 --branch 0.28.1 https://github.com/shellspec/shellspec.git "$HOME/shellspec"
          echo "$HOME/shellspec" >> "$GITHUB_PATH"
      - name: Identidad de git para las pruebas
        run: |
          git config --global user.name "Pruebas"
          git config --global user.email "pruebas@example.invalid"
      - name: Correr las pruebas
        # En Windows, RUNNER_TEMP llega como D:\_temp y ShellSpec necesita una ruta de Unix.
        run: |
          temporal="${RUNNER_TEMP:-/tmp}"
          if command -v cygpath >/dev/null 2>&1; then temporal="$(cygpath -u "$temporal")"; fi
          TMPDIR="$temporal" shellspec

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.21.2 dir /repo --no-banner --redact

  todo-en-verde:
    name: Todo en verde
    runs-on: ubuntu-latest
    needs: [lint, manifiestos, pruebas, secretos]
    if: always()
    steps:
      - name: Revisar resultados
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.manifiestos.result }}" != "success" ]] || \
             [[ "${{ needs.pruebas.result }}" != "success" ]] || \
             [[ "${{ needs.secretos.result }}" != "success" ]]; then
            echo "Algo falló."
            exit 1
          fi
          echo "Todo en verde."
