# Docker Compose de DESARROLLO (DISENO D.6.1 y D.6.2). Desde esta carpeta:
#
#   cp .env.ejemplo .env      # y reemplazar los CAMBIAR_...
#   docker compose up -d --build
#   curl -k https://localhost:{{PUERTO_HTTPS}}/salud
#   docker compose down -v    # baja todo y borra los datos
#
# Contenedores del esqueleto (D.6.1): nginx, web, worker, worker-outbox, beat, postgres, redis.
# Lo demas que pida tu DISENO (almacenamiento de archivos, antivirus, observabilidad, respaldos,
# servicios propios...) se agrega aqui con el elemento del plan que lo construya.
#
# Regla del host: los contenedores de este proyecto llevan el prefijo `{{SLUG}}` (nombre del
# proyecto de Compose) y solo publican puertos del rango propio del proyecto, a partir de
# {{PUERTO_BASE}}. Nunca se publican los puertos reservados del host ({{PUERTOS_RESERVADOS}}).
#
# Redes de D.6.1: `borde` (nginx), `aplicacion` (web, worker, worker-outbox, beat) y `datos` (postgres, redis), esta
# ultima SIN salida a internet. Ningun servicio publica puertos salvo nginx; PostgreSQL no se
# publica (para entrar: `docker compose exec postgres psql -U app_admin app`), asi que no hay
# riesgo de chocar con otro PostgreSQL de tu maquina.

name: {{SLUG}}-dev

x-imagen-app: &imagen-app
  image: ${APP_IMAGEN:-{{SLUG}}:dev}
  build:
    context: ..
    dockerfile: despliegue/Dockerfile

# Contenedor endurecido: sistema de archivos de solo lectura, sin capacidades de Linux.
x-endurecido: &endurecido
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

# Entorno de la aplicacion (web y worker): rol de ejecucion SIN ownership. No incluye nada del rol
# de migraciones (configuracion/settings/prod.py lo rechaza si aparece).
x-entorno-app: &entorno-app
  DJANGO_SETTINGS_MODULE: configuracion.settings.prod
  SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env (ver .env.ejemplo)}
  APP_LLAVE_HUELLA: ${APP_LLAVE_HUELLA:?define APP_LLAVE_HUELLA en .env (ver .env.ejemplo)}
  # Llave que cifra el secreto del segundo factor: distinta de las otras dos.
  APP_LLAVE_SEGUNDO_FACTOR: ${APP_LLAVE_SEGUNDO_FACTOR:?define APP_LLAVE_SEGUNDO_FACTOR en .env (ver .env.ejemplo)}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?define ALLOWED_HOSTS en .env (ver .env.ejemplo)}
  CONFIAR_EN_PROXY_TLS: "true" # siempre hay nginx delante y es quien fija X-Forwarded-Proto
  # Nombre que muestra la interfaz y que aparece como EMISOR en la aplicacion de codigos.
  APP_NOMBRE_APLICACION: ${APP_NOMBRE_APLICACION:-{{NOMBRE_PROYECTO}}}
  # Zona horaria con la que se muestran las fechas (se guardan en UTC). Vacia: UTC.
  APP_ZONA_HORARIA: ${APP_ZONA_HORARIA:-}
  SECURE_SSL_REDIRECT: "true"
  HSTS_SEGUNDOS: ${HSTS_SEGUNDOS:-31536000}
  HSTS_SUBDOMINIOS: ${HSTS_SUBDOMINIOS:-true}
  HSTS_PRELOAD: ${HSTS_PRELOAD:-true}
  DATABASE_URL: postgres://app_web:${APP_WEB_PASSWORD:?define APP_WEB_PASSWORD en .env}@postgres:5432/app
  REDIS_URL: redis://:${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}@redis:6379/0
  # Adaptadores de los puertos (DISENO D.1.4, D.6.2): en DESARROLLO, los sistemas externos van
  # SIMULADOS. `settings.prod` se niega a arrancar con un falso; este permiso solo vale con
  # ALLOWED_HOSTS de la propia maquina (configuracion/adaptadores.py). Pruebas y produccion NO lo
  # llevan. Cada puerto elegible que agregues va aqui como `APP_ADAPTADOR_<PUERTO>: falso`.
  APP_PERMITIR_ADAPTADORES_FALSOS: "true"

services:
  # Un solo paso: genera el certificado autofirmado en un volumen (no se versiona). Ver README.
  # Corre como root pero SOLO con CHOWN (cambia el dueno de la llave a nginx, uid 101); el script
  # hace `chmod` ANTES de `chown` y borra los archivos previos, para no necesitar FOWNER ni
  # DAC_OVERRIDE.
  certificado:
    <<: *endurecido
    image: alpine/openssl:3.5.4@sha256:42c7389ef077aed0eb4e96d0abbd094083d701bbaff1313073b061c0c9cd8278
    entrypoint: ["/bin/sh", "/generar_certificado.sh"]
    environment:
      APP_NOMBRE_PUBLICO: ${APP_NOMBRE_PUBLICO:-localhost}
    volumes:
      - ./nginx/generar_certificado.sh:/generar_certificado.sh:ro
      - certificados:/certs
    cap_add:
      - CHOWN
    network_mode: none
    restart: "no"

  # El entrypoint de la imagen arranca como root (prepara el directorio de datos) y baja a `postgres`
  # con su-exec, asi que necesita un minimo de capacidades: CHOWN, FOWNER y DAC_OVERRIDE (dueno y
  # permisos de PGDATA), SETUID y SETGID (bajar de usuario). Todo lo demas se descarta.
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_USER: app_admin
      POSTGRES_DB: app
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD en .env}
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_admin -d app"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [datos]
    restart: unless-stopped

  # `command: sh -c` saltea la logica del entrypoint que baja de root a `redis`, asi que el usuario
  # se fija aqui. Un volumen `redis-datos` creado ANTES de este cambio es de root: hay que borrarlo
  # (`docker compose down -v`, ver README).
  redis:
    <<: *endurecido
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    user: redis
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?define REDIS_PASSWORD en .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-datos:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [datos]
    restart: unless-stopped

  # Un solo paso, ANTES de la aplicacion: crea/actualiza los roles (D.6.3) y migra el esquema con el
  # rol dueno. Es el unico contenedor con las credenciales de administracion y de migraciones.
  migrar:
    <<: [*imagen-app, *endurecido]
    command:
      - sh
      - -c
      - python -m herramientas.roles_bd && python manage.py migrate --noinput && python -m herramientas.roles_bd
    environment:
      DJANGO_SETTINGS_MODULE: configuracion.settings.migraciones
      SECRET_KEY: ${SECRET_KEY:?define SECRET_KEY en .env (ver .env.ejemplo)}
      DATABASE_ADMIN_URL: postgres://app_admin:${POSTGRES_ADMIN_PASSWORD:?define POSTGRES_ADMIN_PASSWORD en .env}@postgres:5432/app
      DATABASE_MIGRACIONES_URL: postgres://app_migraciones:${APP_MIGRACIONES_PASSWORD:?define APP_MIGRACIONES_PASSWORD en .env}@postgres:5432/app
      APP_MIGRACIONES_PASSWORD: ${APP_MIGRACIONES_PASSWORD}
      APP_WEB_PASSWORD: ${APP_WEB_PASSWORD:?define APP_WEB_PASSWORD en .env}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
    networks: [datos]
    restart: "no"

  web:
    <<: [*imagen-app, *endurecido]
    environment: *entorno-app
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # HEALTHCHECK de la imagen: GET /salud por el loopback del contenedor.
    # Limites: un proceso de uvicorn con su pool de hilos para las vistas sincronas; 512 MB
    # cubre un Django con DRF en reposo con holgura (medido: decenas de MB) y 256 procesos/hilos
    # impide que un fallo o un ataque agote la tabla de procesos del host. Se suben aqui si la
    # carga real los supera.
    mem_limit: 512m
    pids_limit: 256
    networks: [aplicacion, datos]
    restart: unless-stopped

  worker:
    <<: [*imagen-app, *endurecido]
    command:
      - celery
      - -A
      - configuracion
      - worker
      - --loglevel=INFO
      - --concurrency=2
      - -Q
      - celery
    environment: *entorno-app
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A configuracion inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    # Limites: proceso principal de Celery y 2 hijos (`--concurrency=2`), cada uno con la
    # aplicacion Django cargada; 768 MB deja holgura para tareas que procesen archivos y 256
    # procesos/hilos acota un fallo (p. ej. una tarea que lanza procesos sin fin).
    mem_limit: 768m
    pids_limit: 256
    networks: [aplicacion, datos]
    restart: unless-stopped

  # Cola DEDICADA del outbox (D.6.1): entrega los eventos a sus consumidores, con
  # reintentos.
  # Aparte de `worker` para que un pico de tareas pesadas no frene la entrega de eventos. Un solo
  # proceso basta: dos despachadores a la vez son seguros (SKIP LOCKED) si algun dia se escala. El
  # apagado es limpio: SIGTERM termina la entrega en curso (cada entrega es una transaccion), y lo
  # que quede pendiente lo toma el siguiente despachador.
  worker-outbox:
    <<: [*imagen-app, *endurecido]
    command:
      - celery
      - -A
      - configuracion
      - worker
      - --loglevel=INFO
      - --concurrency=1
      - -Q
      - outbox
      - -n
      - outbox@%h
    environment: *entorno-app
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A configuracion inspect ping -d outbox@$$HOSTNAME --timeout 5 | grep -q pong
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 30s
    networks: [aplicacion, datos]
    restart: unless-stopped

  # Disparador periodico (D.6.1): cada 5 segundos le pide al outbox que despache lo pendiente. SOLO
  # puede haber uno (dos `beat` duplicarian las tareas). Su horario y su pid van a /tmp (en
  # memoria). Tambien programa la purga diaria del outbox (retencion de 30 dias).
  beat:
    <<: [*imagen-app, *endurecido]
    command:
      - celery
      - -A
      - configuracion
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/celerybeat-schedule
      - --pidfile=/tmp/celerybeat.pid
    environment: *entorno-app
    depends_on:
      migrar:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 $$(cat /tmp/celerybeat.pid)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    mem_limit: 256m
    pids_limit: 128
    stop_grace_period: 15s
    networks: [aplicacion, datos]
    restart: unless-stopped

  nginx:
    image: nginxinc/nginx-unprivileged:1.28-alpine@sha256:7377697a821c131a924a7105fafbe7414db4e9fcc77a6f08f776f33f141ec3f8
    environment:
      NGINX_ENVSUBST_FILTER: ^NGINX_
      NGINX_NOMBRE_PUBLICO: ${APP_NOMBRE_PUBLICO:-localhost}
      NGINX_SUFIJO_PUERTO_HTTPS: ${APP_SUFIJO_PUERTO_HTTPS:-:{{PUERTO_HTTPS}}}
      # Limite de POST por IP en /ingresar y sus etapas (D.5.4). Ver el README.
      NGINX_LIMITE_INGRESO: ${APP_LIMITE_INGRESO:-180r/m}
      NGINX_RAFAGA_INGRESO: ${APP_RAFAGA_INGRESO:-40}
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - certificados:/etc/nginx/certs:ro
    ports:
      - "${APP_ENLACE:-127.0.0.1}:${APP_PUERTO_HTTP:-{{PUERTO_HTTP}}}:8080"
      - "${APP_ENLACE:-127.0.0.1}:${APP_PUERTO_HTTPS:-{{PUERTO_HTTPS}}}:8443"
    depends_on:
      certificado:
        condition: service_completed_successfully
      web:
        condition: service_healthy
    # Sistema de archivos de solo lectura. nginx escribe en: /tmp (pid y temporales del
    # cuerpo de las peticiones), /var/cache/nginx, /run y /etc/nginx/conf.d (el arranque genera ahi
    # `default.conf` desde la plantilla). Todo en memoria: no sobrevive al contenedor.
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /run
      - /etc/nginx/conf.d:mode=755,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Sano = el puerto 8080 contesta 301 a su nombre publico (lo que hace el bloque HTTP). No se usa
    # `wget`: BusyBox sigue la redireccion hacia HTTPS (certificado autofirmado) y no deja ver el 301.
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'GET / HTTP/1.0\r\nHost: %s\r\n\r\n' "$$NGINX_NOMBRE_PUBLICO"
          | nc -w 3 127.0.0.1 8080 | head -n 1 | grep -q ' 301 '
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 6
    networks: [borde, aplicacion]
    restart: unless-stopped

networks:
  borde: {}
  aplicacion: {}
  datos:
    internal: true # sin salida a internet

volumes:
  certificados: {}
  postgres-datos: {}
  redis-datos: {}
